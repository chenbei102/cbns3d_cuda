name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so this builds
# the library and the gtest unit tests and runs them on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behavior or timing, so it complements real-GPU testing and
# does not replace it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "test/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (CUDA 13.0 and simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@deff5781e8adfd83dec98dd5242dcbc96a564773 # v0.1.10
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # 90-virtual embeds PTX only, which the simulator runs. The simulator
      # needs a shared CUDA runtime (the legacy find_package(CUDA) is told so
      # with CUDA_USE_STATIC_CUDA_RUNTIME=OFF). The project sets C++14 for CUDA,
      # but the thrust in CUDA 13 needs C++17, hence CMAKE_CUDA_STANDARD=17.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=90-virtual \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared \
            -DCUDA_USE_STATIC_CUDA_RUNTIME=OFF \
            -DCMAKE_CUDA_STANDARD=17 \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --target unit_tests -j3

      # The tests compare kernel output (gradients, grid metrics) with
      # analytical values. The job fails on a simulator error, a missing
      # device, skipped tests or an unexpected test count.
      - name: Test
        run: |
          set -o pipefail
          vgpu run ./build/unit_tests 2>&1 | tee test.log
          if grep -Ei "VirtualGPU error|no CUDA-capable device|no device" test.log; then
            echo "simulator or device error in the log"; exit 1
          fi
          grep -q "\[  PASSED  \] 5 tests" test.log
          if grep -Eq "SKIPPED|FAILED" test.log; then exit 1; fi
